<!-- index.html -->
<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Фруктик Чат - дружелюбный помощник для детей в учебе">
    <meta name="keywords" content="чат, помощник, учеба, дети, фруктик">
    <title>🍓 Фруктик Чат - Помощник в учёбе</title>
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Фруктик Чат">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Фруктик Чат">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ff6b6b">
    <meta name="msapplication-TileColor" content="#ff6b6b">
    
    <!-- Force light theme -->
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    
    <!-- Styles and Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icons/icon-32x32.png">
    <link rel="apple-touch-icon" href="icons/icon-180x180.png">
</head>
<body class="min-h-screen flex items-center justify-center p-0 no-select">
    <!-- Детские улучшения -->
    <div class="kid-friendly-elements">
        <!-- Плавающие дружелюбные персонажи -->
        <div class="floating-character floating-character-1">🐰</div>
        <div class="floating-character floating-character-2">🐻</div>
        <div class="floating-character floating-character-3">🐱</div>
        <div class="floating-character floating-character-4">🐶</div>
        <div class="floating-character floating-character-5">🦊</div>
        
        <!-- Интерактивные кнопки звуков -->
        <div class="sound-controls">
            <button id="soundToggle" class="sound-btn" aria-label="Включить звуки">
                <i class="fas fa-volume-up"></i>
            </button>
            <button id="celebrationBtn" class="celebration-btn" aria-label="Запустить праздник">
                <i class="fas fa-party-horn"></i>
            </button>
            <button id="kidsSettingsBtn" class="kids-settings-btn" aria-label="Детские настройки">
                <i class="fas fa-cog"></i>
            </button>
        </div>
        
        <!-- Детская панель инструментов -->
        <div class="kids-toolbar">
            <button class="kid-tool-btn" id="colorChanger" title="Изменить цвета">
                <i class="fas fa-palette"></i>
            </button>
            <button class="kid-tool-btn" id="fontSizeToggle" title="Увеличить шрифт">
                <i class="fas fa-text-height"></i>
            </button>
            <button class="kid-tool-btn" id="highContrastToggle" title="Высокая контрастность">
                <i class="fas fa-circle-half-stroke"></i>
            </button>
            <button class="kid-tool-btn" id="bigButtonsToggle" title="Большие кнопки">
                <i class="fas fa-expand-alt"></i>
            </button>
        </div>

        <!-- Интерактивные элементы для поощрения -->
        <div class="reward-stars" id="rewardStars"></div>
        <div class="encouragement-messages" id="encouragementMessages"></div>
    </div>

    <!-- Модальное окно для детских настроек -->
    <div id="kidsSettingsModal" class="modal kids-modal">
        <div class="modal-overlay"></div>
        <div class="modal-content kids-modal-content compact-modal">
            <div class="modal-header">
                <h2>🎮 Детские настройки</h2>
                <button class="modal-close" id="closeKidsSettingsModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body compact-modal-body">
                <div class="settings-grid">
                    <div class="kids-option">
                        <label class="kids-toggle">
                            <input type="checkbox" id="bigButtonsToggleModal" checked>
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">Большие кнопки</span>
                        </label>
                    </div>
                    <div class="kids-option">
                        <label class="kids-toggle">
                            <input type="checkbox" id="soundEffectsToggleModal" checked>
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">Звуковые эффекты</span>
                        </label>
                    </div>
                    <div class="kids-option">
                        <label class="kids-toggle">
                            <input type="checkbox" id="simpleLanguageToggleModal">
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">Простой язык</span>
                        </label>
                    </div>
                    <div class="kids-option">
                        <label class="kids-toggle">
                            <input type="checkbox" id="highContrastToggleModal">
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">Высокая контрастность</span>
                        </label>
                    </div>
                    <div class="kids-option">
                        <label class="kids-toggle">
                            <input type="checkbox" id="floatingCharactersToggleModal" checked>
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">Плавающие персонажи</span>
                        </label>
                    </div>
                </div>
                
                <div class="theme-section">
                    <h3>🎨 Цветовая тема:</h3>
                    <div class="color-themes">
                        <button class="color-theme-btn active" data-theme="default">
                            <span class="theme-emoji">🍓</span>
                            <span class="theme-name">Стандартная</span>
                        </button>
                        <button class="color-theme-btn" data-theme="ocean">
                            <span class="theme-emoji">🌊</span>
                            <span class="theme-name">Океан</span>
                        </button>
                        <button class="color-theme-btn" data-theme="forest">
                            <span class="theme-emoji">🌳</span>
                            <span class="theme-name">Лес</span>
                        </button>
                        <button class="color-theme-btn" data-theme="candy">
                            <span class="theme-emoji">🍬</span>
                            <span class="theme-name">Конфетная</span>
                        </button>
                    </div>
                </div>
                
                <div class="volume-section">
                    <h3>🔊 Громкость звуков:</h3>
                    <div class="volume-control">
                        <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider">
                        <span class="volume-value" id="volumeValue">80%</span>
                    </div>
                </div>
            </div>
            <div class="modal-actions compact-actions">
                <button id="resetKidsSettings" class="helper-btn">Сбросить</button>
                <button id="saveKidsSettings" class="send-btn">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Основной контейнер приложения -->
    <div class="app-container">
        <!-- Боковая панель с чатами -->
        <div class="chats-sidebar" id="chatsSidebar">
            <div class="sidebar-header">
                <h2 class="text-xl font-bold">Мои чаты</h2>
                <button id="closeSidebar" class="text-white text-xl close-sidebar-btn" aria-label="Закрыть боковую панель">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>
            <div class="sidebar-content">
                <div class="sidebar-info">
                    <p class="text-sm mb-4">Здесь отображаются все ваши чаты с Фруктиком</p>
                    <div class="flex items-center justify-between text-xs">
                        <span>Всего чатов: <span id="chatsCount">0</span></span>
                        <button id="clearAllChats" class="text-red-300 hover:text-red-100 transition-colors">
                            Очистить все
                        </button>
                    </div>
                </div>
                
                <div id="chatsList" role="list">
                    <!-- Список чатов будет здесь -->
                </div>
            </div>
        </div>
        
        <!-- Чат контейнер -->
        <div class="chat-container">
            <!-- Заголовок чата -->
            <header class="header">
                <button id="menuButton" class="menu-btn" aria-label="Открыть меню чатов">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <div class="text-center flex-1 px-4">
                    <h1 class="text-2xl md:text-3xl font-bold drop-shadow-lg">🍓 Фруктик Чат 🍍</h1>
                    <div class="text-white/90 text-sm mt-1 hidden md:block">Помогаю в учёбе и отвечаю на вопросы!</div>
                    <div class="text-white/90 text-xs mt-1 md:hidden">Помощник в учёбе</div>
                </div>
                <button id="newChatButton" class="new-chat-btn" aria-label="Создать новый чат">
                    <i class="fas fa-plus" aria-hidden="true"></i> 
                    <span class="hidden md:inline">Новый чат</span>
                </button>
            </header>
            
            <!-- Область сообщений -->
            <main class="messages-container" id="chatMessages" role="log" aria-live="polite">
                <!-- Сообщения загружаются здесь -->
            </main>
            
            <!-- Индикатор набора -->
            <div id="typingIndicator" class="typing-indicator hidden" aria-hidden="true">
                <div class="flex items-start">
                    <div class="bot-avatar">
                        <div class="sparkle-ring"></div>
                        <div class="avatar-emoji-container">
                            <span class="avatar-emoji">🍍</span>
                        </div>
                    </div>
                    <div class="chat-bubble bot-bubble">
                        <div class="typing-text">Фруктик печатает</div>
                        <div class="typing-dots">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Поле ввода -->
            <footer class="input-container">
                <div class="input-wrapper">
                    <div class="input-group">
                        <div class="input-field-container">
                            <textarea 
                                id="messageInput" 
                                placeholder="Напиши сообщение Фруктику... 🍓" 
                                class="message-input"
                                aria-label="Сообщение для Фруктика"
                                maxlength="1000"
                                rows="1"
                            ></textarea>
                            <div class="input-character-count" id="charCount">
                                0/1000
                            </div>
                        </div>
                        <button 
                            id="sendButton"
                            class="send-btn"
                            aria-label="Отправить сообщение"
                            disabled
                        >
                            <i class="fas fa-paper-plane" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="input-helpers">
                        <button class="helper-btn" id="quickQuestion1" data-question="Помоги с домашним заданием">
                            <span>📚</span> Домашка
                        </button>
                        <button class="helper-btn" id="quickQuestion2" data-question="Объясни тему урока">
                            <span>🎯</span> Объясни
                        </button>
                        <button class="helper-btn" id="quickQuestion3" data-question="Придумай интересный факт">
                            <span>💡</span> Факт
                        </button>
                        <button class="helper-btn" id="quickQuestion4" data-question="Расскажи сказку">
                            <span>📖</span> Сказка
                        </button>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- Оверлей для закрытия боковой панели -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
    
    <!-- Статус сообщение -->
    <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(registration => console.log('SW registered'))
                .catch(error => console.log('SW registration failed'));
        }
    </script>

    <!-- Загружаем API конфиг первым -->
    <script src="api-config.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
    <script src="kids-features.js"></script>
</body>
</html>
